name: Update holiday data

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of every month, 06:00 UTC (covers 1 January too)
  workflow_dispatch: # manual button in the Actions tab

permissions:
  contents: write # push the version commit and tag
  id-token: write # needed for npm provenance

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Pull the newest holiday rules
        run: npm i -D date-holidays@latest --no-audit --no-fund

      - name: Regenerate data
        run: npm run generate

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/holidays.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No holiday changes, nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Commit, bump version, publish
        if: steps.diff.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/holidays.json package.json package-lock.json
          git commit -m "chore: refresh holiday data"
          npm version patch -m "chore: update holiday data (%s)"
          git push --follow-tags
          npm publish --provenance --access public
